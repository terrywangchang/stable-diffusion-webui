# ============================================
# 客流数据填报系统 - 后端服务配置
# Spring Boot 2.7.x  /  JDK 8  /  MySQL 8.0
# ============================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: keliu-data-backend

  # ========= 数据源配置 =========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/keliu_data?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000

  # ========= Redis 配置 =========
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  # ========= 文件上传 =========
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

# ========= MyBatis-Plus 配置 =========
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.keliu.data.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========= JWT 配置 =========
jwt:
  # 密钥（生产环境请使用 256+ 位随机串）
  secret: KeliuDataSystemSecretKey_2026_SpringBoot_JWT_Token_Secret_Key_Must_Be_Long_Enough_32Bytes
  # 管理员 Token 有效期（秒）= 12小时
  admin-expire: 43200
  # 从业人员 Token 有效期（秒）= 7天
  staff-expire: 604800
  # 请求头名称
  header: Authorization
  # Token 前缀
  prefix: "Bearer "

# ========= 小程序 / 微信配置 =========
wechat:
  appid: your_wechat_appid
  secret: your_wechat_secret

# ========= Knife4j 接口文档 =========
knife4j:
  enable: true
  setting:
    language: zh_cn

# ========= 系统自定义配置 =========
keliu:
  # 填报窗口期（每日 00:00 - 23:50）
  fill-window-end-minute: 1430
  # 催报定时任务 cron（每天 20:00 执行）
  urge-cron: "0 0 20 * * ?"
  # 数据导出白名单角色
  export-whitelist: admin,leader
  # 补报超期天数
  supplement-deadline-days: 3

# ========= 日志 =========
logging:
  level:
    com.keliu.data: debug
    org.springframework.security: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
